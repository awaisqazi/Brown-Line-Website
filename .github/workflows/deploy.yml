name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [ main ]

  # Rebuild the site automatically every 4 hours so Supabase CSV imports go live.
  schedule:
    - cron: '0 */4 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Supabase's realtime client expects native WebSocket support during the
  # Astro static build; Node 24 also avoids GitHub's Node 20 deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 24
        env:
          PUBLIC_BEEHIIV_URL: ${{ vars.PUBLIC_BEEHIIV_URL }}
          PUBLIC_SITE_URL: https://thebrownlinechi.com
          SUPABASE_URL: https://xuursvzrlbqiwcevzhao.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_aqwn4tleOVrkkFS1NUJLxw_xW2NExGD

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
