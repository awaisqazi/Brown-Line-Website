name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [ main ]

  # Rebuild the site automatically every 4 hours so Supabase CSV imports go live.
  schedule:
    - cron: '0 */4 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Supabase's realtime client expects native WebSocket support during the
  # Astro static build; Node 24 also avoids GitHub's Node 20 deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 24
        env:
          PUBLIC_SITE_URL: https://thebrownlinechi.com
          # Google Search Console "HTML tag" verification token (the content
          # value only). Set the repo variable once the property is claimed;
          # the meta tag renders only while it is set.
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          SUPABASE_URL: https://xuursvzrlbqiwcevzhao.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_aqwn4tleOVrkkFS1NUJLxw_xW2NExGD
          # Cloudflare Turnstile site key for the public submit-event form. When the
          # repo variable is unset the build falls back to Cloudflare's TEST key.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          # Google Analytics 4. The gtag script loads only when this repo variable
          # is set to the GA4 Measurement ID (G-XXXXXXXXXX). Leave it unset to ship
          # no tracker. Analytics uses Consent Mode v2 (denied until the visitor accepts).
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          # Meta pixel for the newsletter ad campaign. The pixel loads only when this
          # repo variable is set to the numeric pixel id. Leave it unset to ship
          # nothing from Meta. It shares the GA consent banner (revoked until Accept).
          PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
          # First day of the public newsletter archive (YYYY-MM-DD). Issues from
          # this date on get an on-site page; earlier ones link to the platform's
          # subscriber archive. Unset, the build uses the default in
          # src/lib/archive.ts (2026-01-01).
          NEWSLETTER_PUBLIC_FROM: ${{ vars.NEWSLETTER_PUBLIC_FROM }}
          # Beehiiv v2 API, the preferred source for newsletter issues at build
          # time (src/lib/beehiiv-api.ts). The key is a repo secret, the
          # publication id a repo variable. With either unset the build reads
          # the RSS feed instead, exactly as a local build without them does.
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ vars.BEEHIIV_PUBLICATION_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
